<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teste de imagens</title>
    <style>
        body {
            padding: 24px;
            font-family: "Segoe UI", Arial, sans-serif;
        }
        .grade {
            display: grid;
            grid-template-columns: repeat(3, 180px);
            gap: 16px;
        }
        .grade div {
            display: grid;
            justify-items: center;
            gap:8px;
            padding: 12px;
            border: 1px solid #c8cfdc;
            border-radius: 10px;
        }
        .grade img {
            width: 110px;
            height: 110px;
            object-fit: contain;
        }
    </style>
</head>
<body>
    <h1>Teste de imagens</h1>
    <p>As duas primeiras vêm da internet (link). A terceira vem da pasta assets/imagens.</p>
 
    <div class="grade">
        <div>
            <img src="https://images.vexels.com/media/users/3/158669/isolated/preview/8715c32a3226480a53ddbbc08e7f83b8-notebook-ilustracao-laptop.png?w=360%22 alt="Notebook">
            <b>Online (Link)</b>
        </div>
 
        <div>
            <img src="https://cdn-icons-png.flaticon.com/512/4320/4320212.png" alt="Fone de ouvido">
            <b>Online (Link)</b>
        </div>
 
        <div>
            <img src="assets/imagens/logo.png" alt="Logo da loja">
            <b>Local (pasta)</b>
        </div>
    </div>
</body>
</html>
